:root{
 --paper:#F3F0E8;--card:#fff;--ink:#0E1B33;--mute:#5A6376;--line:#E2DCCF;--line2:#CFC7B6;
 --navy:#0D2A5B;--navy2:#163A7C;--sun:#FFC81E;--sun2:#FFB800;--ok:#16804A;--warn:#B45309;--sale:#D42F2A;
 --f:'Manrope',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;
 --r:8px;--wrap:1240px;--ease:cubic-bezier(.2,.8,.2,1)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.num,.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--sun2);outline-offset:2px}

/* demo ribbon */
.ribbon{background:var(--ink);color:#fff;font-size:13px;text-align:center;padding:8px 16px}
.ribbon b{color:var(--sun)}
.ribbon a{color:#fff;opacity:.75;margin-left:10px}

/* header */
.top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;flex-direction:column;line-height:1;text-decoration:none;flex:none}
.logo b{font-weight:700;font-size:20px;letter-spacing:.04em}
.logo b i{font-style:normal;color:var(--sun)}
.logo span{font-family:var(--m);font-size:10px;letter-spacing:.18em;opacity:.7;margin-top:5px;text-transform:uppercase}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:42px;border-radius:var(--r);border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 14px 0 40px;outline:none;transition:background .2s,border-color .2s}
.search input::placeholder{color:rgba(255,255,255,.6)}
.search input:focus{background:#fff;color:var(--ink);border-color:#fff}
.search input:focus::placeholder{color:var(--mute)}
.search svg{position:absolute;left:13px;top:12px;width:18px;height:18px;opacity:.7;pointer-events:none}
.tnav{display:flex;align-items:center;gap:6px;margin-left:auto}
.tbtn{height:42px;padding:0 14px;border-radius:var(--r);border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600;font-size:14px;text-decoration:none;transition:background .2s}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn.cart{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.tbtn.cart:hover{background:var(--sun2)}
.tbtn .cnt{font-family:var(--m);font-size:12px;background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px}
.tbtn svg{width:18px;height:18px}

/* hero */
.hero{background:var(--navy);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:48px;align-items:center;padding-top:64px;padding-bottom:72px}
.hero h1{font-size:clamp(38px,4.6vw,62px);line-height:1;letter-spacing:-.035em;font-weight:700;margin:0}
.hero p{font-size:18px;color:rgba(255,255,255,.78);max-width:520px;margin:22px 0 0}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{height:50px;padding:0 22px;border-radius:var(--r);border:1px solid transparent;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .15s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--sun);color:var(--navy)}.btn.y:hover{background:var(--sun2)}
.btn.o{border-color:rgba(255,255,255,.3);color:#fff;background:transparent}.btn.o:hover{background:rgba(255,255,255,.08)}
.btn.n{background:var(--navy);color:#fff}.btn.n:hover{background:var(--navy2)}
.btn.l{background:#fff;border-color:var(--line2);color:var(--ink)}.btn.l:hover{border-color:var(--ink)}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:rgba(255,255,255,.8)}
.facts span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sun);margin-right:8px;vertical-align:2px}

/* slip (hero right) */
.slip{position:relative;background:#FFFDF7;color:var(--ink);border-radius:6px 6px 0 0;padding:26px 26px 30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6);transform:rotate(1.2deg);font-size:14px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:radial-gradient(circle at 8px 0,transparent 7px,#FFFDF7 7.5px) 0 0/16px 12px repeat-x}
.slip h4{margin:0;font-family:var(--m);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.slip .sl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line2)}
.slip .sl img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.slip .sl b{display:block;font-weight:700;font-size:14px;line-height:1.25}
.slip .sl small{font-family:var(--m);font-size:12px;color:var(--mute)}
.slip .sl .num{font-weight:700}
.slip .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-weight:700;font-size:20px}
.slip .stamp{position:absolute;right:22px;bottom:58px;transform:rotate(-9deg);border:2px solid var(--ok);color:var(--ok);font-family:var(--m);font-weight:700;font-size:12px;letter-spacing:.12em;padding:6px 10px;border-radius:4px;opacity:.85}

/* sections */
.sec{padding:72px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.sh h2{font-size:clamp(26px,3vw,36px);letter-spacing:-.025em;line-height:1.1;margin:0;font-weight:700}
.sh p{margin:6px 0 0;color:var(--mute)}
.link{font-weight:700;text-decoration:none;border-bottom:2px solid var(--sun);padding-bottom:2px;white-space:nowrap}

/* categories rail */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--ink);color:#fff;text-align:left}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,16,34,.92),rgba(8,16,34,0) 60%)}
.cat span{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;font-weight:700;font-size:16px;line-height:1.2}
.cat small{display:block;font-family:var(--m);font-weight:500;font-size:12px;opacity:.75;margin-top:4px}
.cat:hover img{transform:scale(1.06)}

/* catalog */
.catalog{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.side{position:sticky;top:92px}
.side h3{font-family:var(--m);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.side button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:6px;font-weight:600;color:var(--ink)}
.side button small{font-family:var(--m);color:var(--mute)}
.side button:hover{background:rgba(13,42,91,.06)}
.side button.on{background:var(--navy);color:#fff}.side button.on small{color:rgba(255,255,255,.7)}
.side .note{margin-top:20px;padding:14px;border:1px dashed var(--line2);border-radius:var(--r);font-size:13px;color:var(--mute)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar .found{font-weight:700;margin-right:auto}
.bar select{height:40px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;padding:0 10px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:none;height:38px;padding:0 12px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:none;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .3s,transform .3s var(--ease)}
.pc:hover{border-color:var(--line2);box-shadow:0 18px 40px -24px rgba(14,27,51,.35);transform:translateY(-2px)}
.pc .ph{position:relative;aspect-ratio:1;background:#F7F5F0;border:0;padding:0;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.pc:hover .ph img{transform:scale(1.04)}
.tag{position:absolute;left:10px;top:10px;font-family:var(--m);font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:4px;background:var(--sale);color:#fff}
.tag.low{background:var(--warn)}
.pc .bd{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc .br{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);min-height:14px}
.pc h3{margin:0;font-size:15px;line-height:1.3;font-weight:700}
.pc h3 button{all:unset;cursor:pointer}
.pc h3 button:hover{text-decoration:underline;text-decoration-color:var(--sun2);text-decoration-thickness:2px}
.spec{display:flex;flex-wrap:wrap;gap:4px}
.spec span{font-family:var(--m);font-size:12px;padding:3px 7px;border-radius:4px;background:#EEF1F7;color:var(--navy)}
.price{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.price b{font-family:var(--m);font-size:20px;font-weight:700;letter-spacing:-.02em}
.price s{font-family:var(--m);font-size:13px;color:var(--mute)}
.price small{color:var(--mute);font-size:13px}
.boxp{font-family:var(--m);font-size:12px;color:var(--mute)}
.ex{font-family:var(--m);font-size:10px;color:var(--warn);border:1px solid #F3D9B5;background:#FFF7EB;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:2px}
.locked{display:flex;align-items:center;gap:8px;margin-top:auto;padding:10px 12px;border-radius:6px;background:#F3F0E8;color:var(--mute);font-size:13px;font-weight:600;border:0;width:100%;text-align:left}
.locked svg{width:16px;height:16px;flex:none}
.add{height:42px;border-radius:6px;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:14px;transition:background .2s}
.add:hover{background:var(--navy2)}
.step{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;height:42px;border-radius:6px;overflow:hidden;border:1px solid var(--navy)}
.step button{border:0;background:var(--navy);color:#fff;font-size:20px;font-weight:600;line-height:1}
.step button:hover{background:var(--navy2)}
.step input{border:0;text-align:center;font-family:var(--m);font-weight:700;min-width:0;width:100%;outline:none;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.math{font-family:var(--m);font-size:12px;color:var(--ok);min-height:18px}

/* list view */
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lr{display:grid;grid-template-columns:56px minmax(0,1fr) 120px 120px 200px;gap:16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr.hd{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:#FBFAF6;padding-top:12px;padding-bottom:12px}
.lr img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.lr .nm b{display:block;font-size:15px;line-height:1.3}
.lr .nm small{font-family:var(--m);font-size:12px;color:var(--mute)}
.lr .r{text-align:right}
.lr .stk{font-family:var(--m);font-size:12px}
.stk.ok{color:var(--ok)}.stk.low{color:var(--warn)}

/* steps */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s;list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.how li{padding:22px 22px 0 0;counter-increment:s}
.how li::before{content:counter(s,decimal-leading-zero);font-family:var(--m);font-weight:700;font-size:13px;color:var(--navy);display:block;margin-bottom:12px}
.how b{display:block;font-size:19px;letter-spacing:-.01em}
.how p{margin:6px 0 0;color:var(--mute);font-size:15px}

/* footer */
.foot{background:var(--ink);color:#fff;padding:64px 0 28px;margin-top:40px}
.foot .big{font-weight:700;font-size:clamp(44px,9vw,128px);letter-spacing:-.04em;line-height:.9}
.foot .big i{font-style:normal;color:var(--sun)}
.foot .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);font-size:15px;color:rgba(255,255,255,.8)}
.foot h5{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:0 0 8px;font-weight:500}
.foot .by{margin-top:36px;font-size:12px;color:rgba(255,255,255,.45)}

/* mobile cart bar */
.mbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;display:none;align-items:center;justify-content:space-between;gap:12px;height:58px;padding:0 18px;border-radius:12px;background:var(--navy);color:#fff;border:0;box-shadow:0 16px 40px -10px rgba(13,42,91,.6);font-weight:700;transform:translateY(120%);transition:transform .4s var(--ease)}
.mbar.on{transform:none}
.mbar .num{color:var(--sun)}

/* drawers & modals */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(9,15,30,0);visibility:hidden;transition:background .35s,visibility 0s .35s}
.scrim.on{background:rgba(9,15,30,.55);visibility:visible;transition:background .35s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(460px,100%);background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .45s var(--ease)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:20px;font-weight:700}
.dh small{font-family:var(--m);color:var(--mute);font-size:12px;display:block}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1}
.db{flex:1;overflow:auto;padding:8px 20px}
.df{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:#FBFAF6}
.ci{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px dashed var(--line2)}
.ci img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.ci b{font-size:14px;line-height:1.3;display:block}
.ci small{font-family:var(--m);font-size:12px;color:var(--mute)}
.ci .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.ci .step{height:34px;grid-template-columns:34px 52px 34px;border-color:var(--line2)}
.ci .step button{background:#F3F0E8;color:var(--ink);font-size:17px}
.ci .num{font-weight:700}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sum{display:grid;gap:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-size:20px;font-weight:700;margin-top:4px}
.prog{height:6px;border-radius:999px;background:#E7E2D6;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s var(--ease)}
.hint{font-size:13px;color:var(--mute)}
.hint.ok{color:var(--ok);font-weight:600}
.hint.warn{color:var(--warn);font-weight:600}

.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;visibility:hidden;pointer-events:none}
.modal.on{visibility:visible;pointer-events:auto}
.mbox{width:min(900px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 40px 100px -30px rgba(0,0,0,.6);transform:translateY(24px) scale(.97);opacity:0;transition:transform .45s var(--ease),opacity .3s}
.modal.on .mbox{transform:none;opacity:1}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pd .pi{background:#F7F5F0;display:grid;place-items:center;min-height:360px}
.pd .pi img{width:100%;height:100%;max-height:560px;object-fit:contain}
.pd .pt{padding:28px;display:flex;flex-direction:column;gap:14px;position:relative}
.pd h3{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.02em}
.pd .x{position:absolute;right:16px;top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-family:var(--m);font-weight:700}
.login{width:min(440px,100%);padding:28px}
.login h3{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.login p{margin:0 0 18px;color:var(--mute);font-size:15px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700}
.fld input,.fld select,.fld textarea{height:46px;border:1px solid var(--line2);border-radius:var(--r);padding:0 12px;background:#fff;outline:none;width:100%}
.fld textarea{height:84px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,42,91,.12)}
.demo-hint{font-family:var(--m);font-size:12px;background:#FFF7DA;border:1px solid #F5E2A0;border-radius:6px;padding:8px 10px;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:16px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--sun2)}

/* checkout */
.page{padding:40px 0 80px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--mute);margin-bottom:16px;border:0;background:none;padding:0}
.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.panel+.panel{margin-top:16px}
.panel h3{margin:0 0 16px;font-size:19px;display:flex;align-items:center;gap:10px}
.panel h3 .n{font-family:var(--m);font-size:12px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:var(--r);padding:14px;cursor:pointer;transition:border-color .2s,background .2s}
.opt input{accent-color:var(--navy);width:18px;height:18px}
.opt b{display:block;font-size:15px}.opt small{color:var(--mute);font-size:13px}
.opt:has(input:checked){border-color:var(--navy);background:#F4F7FD}
.days{display:flex;gap:8px;flex-wrap:wrap}
.days label{flex:1;min-width:92px;border:1px solid var(--line2);border-radius:var(--r);padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:14px}
.days label small{display:block;font-family:var(--m);font-weight:500;color:var(--mute);font-size:12px}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){border-color:var(--navy);background:var(--navy);color:#fff}
.days label:has(input:checked) small{color:rgba(255,255,255,.7)}
.side2{position:sticky;top:92px}
.mini{max-height:300px;overflow:auto;margin:0 -4px;padding:0 4px}
.mini .ci{grid-template-columns:44px minmax(0,1fr) auto;align-items:center;padding:10px 0}
.mini .ci img{width:44px;height:44px}
.qp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.qr{width:200px;height:200px;border:1px solid var(--line2);border-radius:12px;padding:12px;background:#fff}
.banks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.banks button{height:44px;border:1px solid var(--line2);border-radius:var(--r);background:#fff;font-weight:600;font-size:14px;text-align:left;padding:0 12px}
.banks button:hover{border-color:var(--navy)}
.done{text-align:center;max-width:640px;margin:0 auto}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:34px}
.done h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0}
.tl{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));text-align:center;font-size:13px;font-weight:600;color:var(--mute)}
.tl li{position:relative;padding-top:30px}
.tl li::before{content:"";position:absolute;top:8px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid var(--line2);z-index:1}
.tl li::after{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line2)}
.tl li:first-child::after{display:none}
.tl li.on{color:var(--ink)}
.tl li.on::before{background:var(--ok);border-color:var(--ok)}
.tl li.on::after{background:var(--ok)}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord b{display:block}.ord small{font-family:var(--m);color:var(--mute);font-size:12px}
.pill{display:inline-block;font-family:var(--m);font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:#EEF1F7;color:var(--navy);white-space:nowrap}
.pill.new{background:#FFF4D6;color:#8A5A00}.pill.paid{background:#E5F1FF;color:#1D4ED8}.pill.prep{background:#EFE9FF;color:#5B21B6}.pill.ship{background:#E3F4FA;color:#0E7490}.pill.done{background:#E3F5EA;color:var(--ok)}.pill.wait{background:#FDEBD8;color:var(--warn)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:opacity .3s,transform .4s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* reveal */
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .rv.in{opacity:1;transform:none}

/* ---------- admin (app screen) ---------- */
.adm{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh;background:#F6F7F9;color:#111827}
.anav{background:#0B1830;color:#C9D2E3;padding:20px 14px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.anav .logo{color:#fff;padding:0 8px 18px}
.anav button{display:flex;align-items:center;justify-content:space-between;border:0;background:none;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;font-weight:600;font-size:14px}
.anav button:hover{background:rgba(255,255,255,.06)}
.anav button.on{background:rgba(255,200,30,.14);color:var(--sun)}
.anav button small{font-family:var(--m);font-size:11px;background:var(--sun);color:#0B1830;border-radius:999px;padding:0 6px}
.anav .sp{margin-top:auto;font-size:12px;color:#7B879E;padding:8px 12px}
.amain{padding:28px 32px 60px;min-width:0}
.ahd{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ahd h1{margin:0;font-size:24px;letter-spacing:-.02em}
.ahd p{margin:2px 0 0;color:#6B7280;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px}
.kpi small{color:#6B7280;font-size:13px;font-weight:600}
.kpi b{display:block;font-family:var(--m);font-size:26px;letter-spacing:-.02em;margin-top:6px}
.kpi span{font-size:12px;color:#6B7280}
.acard{background:#fff;border:1px solid #E5E7EB;border-radius:10px;overflow:hidden}
.acard h3{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid #E5E7EB;display:flex;justify-content:space-between;align-items:center}
.acols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B7280;text-align:left;font-weight:500;padding:10px 14px;background:#FAFAFB;border-bottom:1px solid #E5E7EB;white-space:nowrap}
.t td{padding:10px 14px;border-bottom:1px solid #F0F1F3;vertical-align:middle}
.t td.nw,.t td.mono{white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:default}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:#FAFBFF}
.t .r{text-align:right}
.t .num{font-weight:700}
.t img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.t input.inl{width:96px;height:34px;border:1px solid #E5E7EB;border-radius:6px;padding:0 8px;font-family:var(--m);text-align:right}
.t input.inl:focus{border-color:var(--navy);outline:none}
.afl{display:flex;gap:6px;flex-wrap:wrap}
.afl button{height:34px;padding:0 12px;border-radius:999px;border:1px solid #E5E7EB;background:#fff;font-weight:600;font-size:13px}
.afl button.on{background:#111827;color:#fff;border-color:#111827}
.abtn{height:38px;padding:0 14px;border-radius:8px;border:1px solid #D1D5DB;background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.abtn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.abtn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.det{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:61;box-shadow:-20px 0 60px rgba(0,0,0,.15);transform:translateX(100%);transition:transform .4s var(--ease);display:flex;flex-direction:column}
.det.on{transform:none}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:#D1D5DB;border:0;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(16px)}
.zone{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zone .acard{padding:0}
.zone ul{list-style:none;margin:0;padding:6px 16px 12px}
.zone li{padding:10px 0;border-bottom:1px dashed #E5E7EB;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.zone li:last-child{border-bottom:0}
.amob{display:none}

/* print: picking slip */
@media print{body>*:not(#print){display:none!important}#print{display:block!important;font:12px/1.4 var(--f);color:#000}#print table{width:100%;border-collapse:collapse}#print td,#print th{border:1px solid #000;padding:6px;text-align:left}}
#print{display:none}

/* responsive */
@media (max-width:1080px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.acols{grid-template-columns:minmax(0,1fr)}.zone{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
 .hero .wrap{grid-template-columns:minmax(0,1fr);gap:40px;padding-top:44px;padding-bottom:56px}
 .slip{transform:none;max-width:520px}
 .catalog{grid-template-columns:minmax(0,1fr)}
 .side{display:none}.chips{display:flex}
 .co{grid-template-columns:minmax(0,1fr)}.side2{position:static}
 .how{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 0}
 .lr{grid-template-columns:48px minmax(0,1fr) 150px}.lr .hide{display:none}
 .adm{grid-template-columns:minmax(0,1fr)}.anav{display:none}.amob{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#0B1830;position:sticky;top:0;z-index:5;scrollbar-width:none}
 .amob button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:rgba(255,255,255,.08);color:#C9D2E3;font-weight:600;font-size:13px}
 .amob button.on{background:var(--sun);color:#0B1830}
 .amain{padding:20px 16px 60px}
}
@media (max-width:640px){
 .wrap{padding:0 16px}
 .top .wrap{height:auto;flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px}
 .search{order:3;flex-basis:100%;max-width:none}
 .tbtn .lbl{display:none}
 .tbtn.cart{display:none}
 .hero p{font-size:16px}
 .sec{padding:52px 0}
 .cats{grid-template-columns:repeat(6,46%);overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
 .cats::-webkit-scrollbar{display:none}.cat{scroll-snap-align:start}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .pc .bd{padding:10px 10px 12px;gap:6px}
 .pc h3{font-size:14px}
 .price b{font-size:17px}
 .spec span{font-size:11px;padding:2px 6px}
 .mbar{display:flex}
 .pd{grid-template-columns:minmax(0,1fr)}.pd .pi{min-height:0;max-height:46vh}.pd .pi img{max-height:46vh}
 .modal{padding:0;align-items:end}.mbox{border-radius:16px 16px 0 0;max-height:92dvh}
 .g2{grid-template-columns:minmax(0,1fr)}
 .qp{grid-template-columns:minmax(0,1fr);justify-items:center}
 .tl{font-size:11px}
 .foot .cols{grid-template-columns:minmax(0,1fr)}
 .how{grid-template-columns:minmax(0,1fr)}
 .ord{grid-template-columns:minmax(0,1fr) auto}.ord .btn{grid-column:1/-1}
 .kpi b{font-size:22px}
 .bar .seg{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.js .rv{opacity:1;transform:none}}
</style>
