:root{
 --paper:#F4F1EA;--card:#fff;--ink:#0E1B33;--mute:#5A6376;--line:#E4DED1;--line2:#CFC7B6;
 --navy:#0D2A5B;--navy2:#163A7C;--deep:#071731;--sun:#FFC81E;--sun2:#FFB800;--gold:#E8C268;--ok:#16804A;--warn:#B45309;--sale:#C8262B;
 --f:'Manrope',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace;
 --r:10px;--wrap:1280px;--ease:cubic-bezier(.2,.8,.2,1);--top:68px
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:140px}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.num,.mono{font-family:var(--m);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--sun2);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none}

/* utility bar */
.util{background:var(--deep);color:rgba(255,255,255,.78);font-size:13px}
.util .wrap{display:flex;align-items:center;gap:18px;height:38px}
.util .addr{display:flex;align-items:center;gap:8px;margin-right:auto}
.util a{display:inline-flex;align-items:center;gap:7px;text-decoration:none;transition:color .2s}
.util a:hover{color:var(--sun)}
.util svg.i{width:15px;height:15px}
.util .ph{font-family:var(--m);color:#fff}

/* header */
.top{position:sticky;top:0;z-index:40;background:rgba(13,42,91,.97);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
@supports (backdrop-filter:blur(1px)){.top{background:rgba(13,42,91,.9);backdrop-filter:saturate(140%) blur(12px);-webkit-backdrop-filter:saturate(140%) blur(12px)}}
.top .wrap{display:flex;align-items:center;gap:22px;height:var(--top)}
.logo{display:flex;align-items:center;gap:12px;line-height:1;text-decoration:none;flex:none}
.logo .mk{width:38px;height:38px;border-radius:9px;background:var(--sun);color:var(--navy);display:grid;place-items:center}
.logo .mk svg{width:22px;height:22px}
.logo b{display:block;font-weight:700;font-size:19px;letter-spacing:.05em}
.logo span{display:block;font-family:var(--m);font-size:10px;letter-spacing:.2em;opacity:.7;margin-top:5px;text-transform:uppercase}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 18px 0 44px;outline:none;transition:background .25s,border-color .25s}
.search input::placeholder{color:rgba(255,255,255,.6)}
.search input:focus{background:#fff;color:var(--ink);border-color:#fff}
.search input:focus::placeholder{color:var(--mute)}
.search svg{position:absolute;left:16px;top:13px;width:18px;height:18px;opacity:.7;pointer-events:none}
.tnav{display:flex;align-items:center;gap:8px;margin-left:auto}
.tbtn{height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600;font-size:14px;text-decoration:none;transition:background .2s,transform .2s}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn.cart{background:var(--sun);border-color:var(--sun);color:var(--navy)}
.tbtn.cart:hover{background:var(--sun2)}
.tbtn .cnt{font-family:var(--m);font-size:12px;background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px}
.tbtn.bump{animation:bump .5s var(--ease)}
@keyframes bump{30%{transform:scale(1.12)}60%{transform:scale(.96)}}

/* buttons */
.btn{height:52px;padding:0 24px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .2s var(--ease),background .2s,box-shadow .3s,border-color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--sun);color:var(--navy);box-shadow:0 10px 30px -10px rgba(255,200,30,.6)}.btn.y:hover{background:var(--sun2);transform:translateY(-2px)}
.btn.o{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.04)}.btn.o:hover{background:rgba(255,255,255,.12)}
.btn.n{background:var(--navy);color:#fff}.btn.n:hover{background:var(--navy2)}
.btn.l{background:#fff;border-color:var(--line2);color:var(--ink)}.btn.l:hover{border-color:var(--ink)}
.btn.sm{height:42px;padding:0 16px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg.i{width:19px;height:19px}

/* hero */
.hero{position:relative;color:#fff;background:var(--deep);overflow:hidden;min-height:clamp(600px,84vh,800px);display:flex;align-items:center}
.hero .hbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 50%;animation:kb 16s var(--ease) both}
@keyframes kb{from{transform:scale(1.1)}to{transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,23,49,.96) 0%,rgba(7,23,49,.88) 30%,rgba(7,23,49,.45) 56%,rgba(7,23,49,.05) 78%),linear-gradient(0deg,rgba(7,23,49,.85) 0%,rgba(7,23,49,0) 34%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-top:64px;padding-bottom:120px}
.hin{max-width:740px}
.tagline{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--gold);font-weight:600;letter-spacing:.01em}
.tagline::before{content:"";width:28px;height:2px;background:var(--gold)}
.hero h1{font-size:clamp(38px,4.3vw,60px);line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:18px 0 0}
.hero h1 span{display:block}
.hero p.lead{font-size:18px;color:rgba(255,255,255,.82);max-width:560px;margin:22px 0 0}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.qrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.qbtn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;font-weight:600;font-size:14px;transition:background .2s,border-color .2s,transform .2s}
@supports (backdrop-filter:blur(1px)){.qbtn{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}}
.qbtn:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);transform:translateY(-2px)}
.qbtn .ic{width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--navy);display:grid;place-items:center}
.qbtn .ic svg{width:15px;height:15px}
.load .ld{opacity:0;transform:translateY(22px);animation:up .9s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}

/* hero slip */
.slip{position:absolute;z-index:3;right:max(28px,calc((100vw - 1280px)/2 + 28px));bottom:118px;width:360px;background:#FFFDF7;color:var(--ink);border-radius:8px 8px 0 0;padding:22px 22px 26px;box-shadow:0 40px 80px -24px rgba(0,0,0,.7);rotate:2deg;font-size:13px}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:11px;background:radial-gradient(circle at 7px 0,transparent 6px,#FFFDF7 6.5px) 0 0/14px 11px repeat-x}
.slip h4{margin:0;font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.slip .sl{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line2)}
.slip .sl img{width:38px;height:38px;object-fit:cover;border-radius:5px}
.slip .sl b{display:block;font-weight:700;font-size:13px;line-height:1.25}
.slip .sl small{font-family:var(--m);font-size:11px;color:var(--mute)}
.slip .sl .num{font-weight:700}
.slip .tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-weight:700;font-size:19px}
.slip .stamp{position:absolute;right:18px;bottom:52px;transform:rotate(-9deg);border:2px solid var(--ok);color:var(--ok);font-family:var(--m);font-weight:700;font-size:11px;letter-spacing:.12em;padding:5px 9px;border-radius:4px;opacity:.85}

/* dock */
.dock{position:relative;z-index:3;margin-top:-64px}
.dock .in{background:#fff;border-radius:16px;box-shadow:0 30px 60px -30px rgba(14,27,51,.35);display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;align-items:stretch}
.dock .it{display:flex;align-items:center;gap:12px;padding:20px 18px;border-right:1px solid var(--line)}
.dock .it .ic{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);color:var(--navy);display:grid;place-items:center;flex:none}
.dock .it .ic svg{width:22px;height:22px}
.dock .it b{display:block;font-size:15px;line-height:1.25;white-space:nowrap}
.dock .it small{color:var(--mute);font-size:13px}
.dock .eu{display:flex;align-items:center;gap:12px;padding:18px 24px;background:var(--navy);color:#fff;border-radius:0 16px 16px 0}
.dock .eu svg{width:46px;height:46px;flex:none}
.dock .eu span{font-size:13px;line-height:1.3;font-weight:600}
.dock .eu i{display:block;font-style:normal;color:var(--gold);font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}

/* marquee */
.marq{overflow:hidden;padding:44px 0 8px;-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marq .tr{display:flex;gap:56px;width:max-content;animation:mq 36s linear infinite}
.marq:hover .tr{animation-play-state:paused}
.marq span{font-weight:700;font-size:clamp(26px,3vw,40px);letter-spacing:-.02em;white-space:nowrap;color:var(--navy);display:flex;align-items:center;gap:56px}
.marq span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun2)}
.marq span.o{color:transparent;-webkit-text-stroke:1.2px var(--navy)}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
.sec{padding:84px 0}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.2vw,42px);letter-spacing:-.03em;line-height:1.05;margin:0;font-weight:700}
.sh p{margin:8px 0 0;color:var(--mute);max-width:560px}
.kick{font-family:var(--m);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--warn);margin-bottom:10px;display:block}
.link{font-weight:700;text-decoration:none;border-bottom:2px solid var(--sun2);padding-bottom:2px;white-space:nowrap;background:none;border-top:0;border-left:0;border-right:0;padding-left:0;padding-right:0}

/* bento categories */
.bento{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:230px 230px;gap:14px}
.bt{position:relative;border:0;padding:0;border-radius:16px;overflow:hidden;background:var(--ink);color:#fff;text-align:left}
.bt:first-child{grid-row:span 2}
.bt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.bt::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(7,16,34,.9),rgba(7,16,34,.15) 55%,rgba(7,16,34,0))}
.bt .tx{position:absolute;left:20px;right:20px;bottom:18px;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bt b{display:block;font-size:20px;line-height:1.15;letter-spacing:-.01em}
.bt:first-child b{font-size:30px}
.bt small{display:block;font-family:var(--m);font-size:12px;opacity:.75;margin-top:6px}
.bt .ar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;flex:none;transform:translateX(-6px);opacity:0;transition:transform .4s var(--ease),opacity .3s}
.bt:hover img{transform:scale(1.07)}
.bt:hover .ar{transform:none;opacity:1}

/* sale band */
.sale{background:var(--sale);color:#fff;position:relative;overflow:hidden}
.sale::before{content:"−7%";position:absolute;right:-20px;top:-60px;font-weight:700;font-size:300px;letter-spacing:-.06em;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
.sale .sh p{color:rgba(255,255,255,.8)}
.sale .kick{color:var(--sun)}
.srow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative}
.sc{background:#fff;color:var(--ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s}
.sc:hover{transform:translateY(-6px);box-shadow:0 30px 50px -25px rgba(0,0,0,.5)}
.sc .ph{aspect-ratio:1;overflow:hidden;position:relative;border:0;padding:0;background:#f6f3ec}
.sc .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.sc:hover .ph img{transform:scale(1.05)}
.sc .bd{padding:16px}
.sc h3{margin:0;font-size:15px;line-height:1.3}
.sc .pr{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.sc .pr b{font-family:var(--m);font-size:24px;color:var(--sale)}
.sc .pr s{font-family:var(--m);color:var(--mute);font-size:14px}

/* catalog */
.ctabs{position:sticky;top:var(--top);z-index:30;background:rgba(244,241,234,.94);border-bottom:1px solid var(--line);margin-bottom:24px}
@supports (backdrop-filter:blur(1px)){.ctabs{background:rgba(244,241,234,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.ctabs .wrap{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-top:12px;padding-bottom:12px;scrollbar-width:none}
.ctabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 6px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:600;font-size:14px;transition:background .25s,color .25s,border-color .25s,transform .2s}
.tab img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.tab .all{width:32px;height:32px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.tab small{font-family:var(--m);color:var(--mute);font-size:12px}
.tab:hover{border-color:var(--navy)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.on small{color:rgba(255,255,255,.7)}
.tab.on .all{background:rgba(255,255,255,.15)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar .found{font-weight:700;margin-right:auto;font-size:15px}
.bar select{height:42px;border:1px solid var(--line2);border-radius:999px;background:#fff;padding:0 14px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:#fff;padding:3px}
.seg button{border:0;background:none;height:34px;padding:0 14px;font-weight:600;font-size:14px;color:var(--mute);border-radius:999px;transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:#fff}
.grp{margin-bottom:48px}
.grp .gh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.grp .gh h3{margin:0;font-size:24px;letter-spacing:-.02em}
.grp .gh small{font-family:var(--m);color:var(--mute);margin-left:10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px}
.pc{background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 var(--line);transition:box-shadow .4s var(--ease),transform .4s var(--ease)}
.pc:hover{box-shadow:0 24px 48px -26px rgba(14,27,51,.45);transform:translateY(-4px)}
.pc .ph{position:relative;aspect-ratio:1;background:#F6F3EC;overflow:hidden}
.pc .pimg{display:block;width:100%;height:100%;border:0;padding:0;background:none}
.pc .pimg img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.pc:hover .pimg img{transform:scale(1.06)}
.badges{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;pointer-events:none}
.bdg{font-family:var(--m);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:var(--sale);color:#fff}
.bdg.low{background:var(--warn)}.bdg.ex{background:#fff;color:var(--warn);border:1px solid #F3D9B5}
.qa{position:absolute;right:10px;bottom:10px}
.plus{width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(13,42,91,.7);transition:transform .3s var(--ease),background .2s}
.plus:hover{transform:scale(1.08) rotate(90deg);background:var(--navy2)}
.plus svg{width:20px;height:20px}
.plus.lock{background:#fff;color:var(--navy);box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.plus.lock:hover{transform:scale(1.06)}
.pill2{display:grid;grid-template-columns:38px 44px 38px;height:46px;border-radius:999px;background:var(--navy);color:#fff;overflow:hidden;box-shadow:0 10px 24px -8px rgba(13,42,91,.7);animation:grow .35s var(--ease)}
@keyframes grow{from{clip-path:inset(0 0 0 calc(100% - 46px) round 999px)}to{clip-path:inset(0 0 0 0 round 999px)}}
.pill2 button{border:0;background:none;color:#fff;font-size:20px;line-height:1}
.pill2 button:hover{background:rgba(255,255,255,.12)}
.pill2 input{border:0;background:none;color:#fff;text-align:center;font-family:var(--m);font-weight:700;min-width:0;width:100%;outline:none;-moz-appearance:textfield}
.pill2 input::-webkit-outer-spin-button,.pill2 input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.meta .sp{color:var(--navy);background:#EEF1F7;border-radius:999px;padding:2px 8px;letter-spacing:0;text-transform:none;white-space:nowrap}
.pc h3{margin:0;font-size:15px;line-height:1.3;font-weight:700}
.pc h3 button{all:unset;cursor:pointer}
.pc h3 button:hover{color:var(--navy2)}
.price{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:6px}
.price b{font-family:var(--m);font-size:21px;font-weight:700;letter-spacing:-.02em}
.price small{color:var(--mute);font-size:13px}
.price s{font-family:var(--m);font-size:13px;color:var(--mute);margin-left:auto}
.boxp{font-family:var(--m);font-size:12px;color:var(--mute)}
.math{font-family:var(--m);font-size:12px;color:var(--ok);font-weight:700}
.locked{display:flex;align-items:center;gap:8px;margin-top:auto;padding:10px 12px;border-radius:10px;background:#F3F0E8;color:var(--mute);font-size:13px;font-weight:600;border:0;width:100%;text-align:left}
.locked svg{width:16px;height:16px;flex:none}
.empty{text-align:center;color:var(--mute);padding:60px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* list view */
.list{background:#fff;border-radius:16px;overflow:hidden}
.lr{display:grid;grid-template-columns:60px minmax(0,1fr) 130px 120px 180px;gap:16px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr.hd{font-family:var(--m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:#FBFAF6;padding-top:12px;padding-bottom:12px}
.lr img{width:60px;height:60px;object-fit:cover;border-radius:10px}
.lr .nm b{display:block;font-size:15px;line-height:1.3}
.lr .nm small{font-family:var(--m);font-size:12px;color:var(--mute)}
.lr .r{text-align:right}
.stk{font-family:var(--m);font-size:12px}
.stk.ok{color:var(--ok)}.stk.low{color:var(--warn)}
.step{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;height:42px;border-radius:999px;overflow:hidden;background:var(--navy);color:#fff}
.step button{border:0;background:none;color:#fff;font-size:19px}
.step button:hover{background:rgba(255,255,255,.12)}
.step input{border:0;background:none;color:#fff;text-align:center;font-family:var(--m);font-weight:700;min-width:0;width:100%;outline:none;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{height:42px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:14px;width:100%}
.add:hover{background:var(--navy2)}

/* why */
.why{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:64px;align-items:center}
.wimg{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1792/2240;container-type:inline-size;box-shadow:0 40px 80px -40px rgba(14,27,51,.5)}
.wimg img{width:100%;height:100%;object-fit:cover}
.chalk{position:absolute;left:70.5%;top:21.2%;width:26%;height:13.4%;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.88);font-weight:600;font-size:3.1cqw;line-height:1.25;letter-spacing:.01em;text-shadow:0 0 1px rgba(255,255,255,.5);transform:rotate(-1deg)}
.wtag{position:absolute;left:20px;bottom:20px;background:var(--sun);color:var(--navy);font-weight:700;padding:12px 18px;border-radius:999px;font-size:15px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.why h2{font-size:clamp(30px,3.6vw,48px);letter-spacing:-.035em;line-height:1.02;margin:0}
.why .sub{color:var(--mute);margin:14px 0 0;max-width:520px}
.wl{list-style:none;margin:36px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:28px 32px}
.wl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:start}
.wl .ic{width:52px;height:52px;border-radius:50%;background:#E7EEDF;color:#2F5D2B;display:grid;place-items:center}
.wl .ic svg{width:24px;height:24px}
.wl b{display:block;font-size:17px;letter-spacing:-.01em}
.wl p{margin:4px 0 0;color:var(--mute);font-size:15px;line-height:1.45}

/* delivery band */
.band{position:relative;color:#fff;overflow:hidden;border-radius:24px;min-height:440px;display:flex;align-items:flex-end}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(7,23,49,.92),rgba(7,23,49,.6) 45%,rgba(7,23,49,.1) 75%)}
.band .in{position:relative;z-index:2;padding:48px;max-width:640px}
.band h2{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.03em;line-height:1.05;margin:0}
.band p{color:rgba(255,255,255,.82);margin:14px 0 0;font-size:17px}
.band .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.how{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:s}
.how li{counter-increment:s;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;font-size:14px}
.how li::before{content:counter(s,decimal-leading-zero);display:block;font-family:var(--m);color:var(--sun);font-size:12px;font-weight:700;margin-bottom:6px}
.how b{display:block;font-size:15px}

/* contact */
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cc{display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:18px;background:#fff;text-decoration:none;transition:transform .35s var(--ease),box-shadow .35s,background .25s,color .25s;min-height:190px}
.cc:hover{transform:translateY(-6px);box-shadow:0 28px 50px -30px rgba(14,27,51,.5);background:var(--navy);color:#fff}
.cc .ic{width:52px;height:52px;border-radius:14px;background:var(--paper);color:var(--navy);display:grid;place-items:center;transition:background .25s}
.cc:hover .ic{background:var(--sun)}
.cc .ic svg{width:24px;height:24px}
.cc b{font-size:19px;letter-spacing:-.01em;margin-top:auto}
.cc small{color:var(--mute);font-size:14px;transition:color .25s}
.cc:hover small{color:rgba(255,255,255,.75)}
.cc .go{font-family:var(--m);font-size:12px;font-weight:700}

/* footer */
.foot{background:var(--deep);color:#fff;padding:72px 0 28px;margin-top:84px}
.foot .big{font-weight:700;font-size:clamp(44px,9vw,132px);letter-spacing:-.045em;line-height:.88}
.foot .big i{font-style:normal;color:var(--sun)}
.foot .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);font-size:15px;color:rgba(255,255,255,.8)}
.foot h5{font-family:var(--m);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin:0 0 10px;font-weight:500}
.foot a{text-decoration:none}.foot a:hover{color:var(--sun)}
.foot .by{margin-top:40px;font-size:12px;color:rgba(255,255,255,.45);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* floating chat + mobile bar */
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:44;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 8px;border-radius:999px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;box-shadow:0 18px 40px -14px rgba(14,27,51,.55);transition:transform .35s var(--ease),bottom .4s var(--ease)}
.fab:hover{transform:translateY(-3px)}
.fab .ic{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.fab .ic svg{width:20px;height:20px}
.fab::after{content:"";position:absolute;left:38px;top:10px;width:10px;height:10px;border-radius:50%;background:#22C55E;border:2px solid #fff}
.mbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:45;display:none;align-items:center;justify-content:space-between;gap:12px;height:58px;padding:0 18px;border-radius:16px;background:var(--navy);color:#fff;border:0;box-shadow:0 16px 40px -10px rgba(13,42,91,.6);font-weight:700;transform:translateY(130%);transition:transform .45s var(--ease)}
.mbar.on{transform:none}
.mbar .num{color:var(--sun)}
.mbar svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px}

/* drawers & modals */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(9,15,30,0);visibility:hidden;transition:background .35s,visibility 0s .35s}
.scrim.on{background:rgba(9,15,30,.55);visibility:visible;transition:background .35s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(460px,100%);background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .5s var(--ease)}
.drawer.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font-size:20px;font-weight:700}
.dh small{font-family:var(--m);color:var(--mute);font-size:12px;display:block}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1;flex:none}
.db{flex:1;overflow:auto;padding:8px 20px}
.df{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:#FBFAF6}
.ci{display:grid;grid-template-columns:60px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px dashed var(--line2)}
.ci img{width:60px;height:60px;object-fit:cover;border-radius:10px}
.ci b{font-size:14px;line-height:1.3;display:block}
.ci small{font-family:var(--m);font-size:12px;color:var(--mute)}
.ci .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.ci .step{height:34px;grid-template-columns:34px 48px 34px;background:#F3F0E8;color:var(--ink)}
.ci .step button,.ci .step input{color:var(--ink)}
.ci .step button:hover{background:rgba(0,0,0,.06)}
.ci .num{font-weight:700}
.sum{display:grid;gap:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-size:20px;font-weight:700;margin-top:4px}
.prog{height:6px;border-radius:999px;background:#E7E2D6;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .6s var(--ease)}
.hint{font-size:13px;color:var(--mute)}
.hint.ok{color:var(--ok);font-weight:600}
.hint.warn{color:var(--warn);font-weight:600}
.modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;visibility:hidden;pointer-events:none}
.modal.on{visibility:visible;pointer-events:auto}
.mbox{width:min(920px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 40px 100px -30px rgba(0,0,0,.6);transform:translateY(24px) scale(.97);opacity:0;transition:transform .5s var(--ease),opacity .3s}
.modal.on .mbox{transform:none;opacity:1}
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pd .pi{background:#F6F3EC;display:grid;place-items:center;min-height:380px}
.pd .pi img{width:100%;height:100%;max-height:580px;object-fit:contain}
.pd .pt{padding:30px;display:flex;flex-direction:column;gap:14px;position:relative}
.pd h3{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.02em;padding-right:40px}
.pd .x{position:absolute;right:16px;top:16px}
.pd .qa{position:static}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-family:var(--m);font-weight:700}
.login{width:min(460px,100%);padding:28px}
.login h3{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.login p{margin:0 0 18px;color:var(--mute);font-size:15px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:13px;font-weight:700}
.fld input,.fld select,.fld textarea{height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:#fff;outline:none;width:100%}
.fld textarea{height:90px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(13,42,91,.12)}
.demo-hint{font-family:var(--m);font-size:12px;background:#FFF7DA;border:1px solid #F5E2A0;border-radius:8px;padding:8px 10px;margin-bottom:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px 4px;margin-right:16px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--sun2)}
.fly{position:fixed;z-index:95;border-radius:12px;object-fit:cover;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.3)}

/* checkout etc */
.page{padding:40px 0 80px}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;color:var(--mute);margin-bottom:16px;border:0;background:none;padding:0}
.co{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:32px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
.panel+.panel{margin-top:16px}
.panel h3{margin:0 0 16px;font-size:19px;display:flex;align-items:center;gap:10px}
.panel h3 .n{font-family:var(--m);font-size:12px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line2);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .2s,background .2s}
.opt input{accent-color:var(--navy);width:18px;height:18px}
.opt b{display:block;font-size:15px}.opt small{color:var(--mute);font-size:13px}
.opt:has(input:checked){border-color:var(--navy);background:#F4F7FD}
.days{display:flex;gap:8px;flex-wrap:wrap}
.days label{flex:1;min-width:92px;border:1px solid var(--line2);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:14px;position:relative}
.days label small{display:block;font-family:var(--m);font-weight:500;color:var(--mute);font-size:12px}
.days input{position:absolute;opacity:0;pointer-events:none}
.days label:has(input:checked){border-color:var(--navy);background:var(--navy);color:#fff}
.days label:has(input:checked) small{color:rgba(255,255,255,.7)}
.side2{position:sticky;top:92px}
.mini{max-height:300px;overflow:auto}
.mini .ci{grid-template-columns:44px minmax(0,1fr) auto;align-items:center;padding:10px 0}
.mini .ci img{width:44px;height:44px}
.qp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.qr{width:200px;height:200px;border:1px solid var(--line2);border-radius:12px;padding:12px;background:#fff}
.banks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.banks button{height:44px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-weight:600;font-size:14px;text-align:left;padding:0 12px}
.banks button:hover{border-color:var(--navy)}
.done{text-align:center;max-width:660px;margin:0 auto}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:34px}
.done h2{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0}
.tl{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));text-align:center;font-size:13px;font-weight:600;color:var(--mute)}
.tl li{position:relative;padding-top:30px}
