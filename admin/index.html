<!doctype html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Nomad · Админ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Geologica:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#07070a;--card:#111117;--line:rgba(255,255,255,.09);--fg:#ece8e0;--mute:rgba(236,232,224,.55);--sun:#ff7a1a;--ok:#3ddc84;--blue:#5aa9ff;--red:#ff5a5a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Geologica,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(7,7,10,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.w{max-width:1100px;margin:0 auto;padding:0 16px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{font-family:Michroma;letter-spacing:.06em;font-size:18px}.logo small{display:block;font:500 9px/1 "IBM Plex Mono";letter-spacing:.5em;color:var(--mute);margin-top:4px}
.btn{font:500 14px Geologica;border:1px solid var(--line);background:#16161d;color:var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:rgba(255,255,255,.25)}.btn.sun{background:var(--sun);color:#140800;border-color:var(--sun);font-weight:600}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;min-width:120px;cursor:pointer}
.st b{display:block;font-size:28px;font-weight:600}.st span{font:500 11px "IBM Plex Mono";letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.st.on{border-color:var(--sun)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input.q{flex:1;min-width:200px;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:10px 16px;font:400 15px Geologica}
.list{display:grid;gap:12px;padding-bottom:60px}
.o{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.o.new{border-color:rgba(255,122,26,.55);box-shadow:0 0 0 1px rgba(255,122,26,.15)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.nm{font-size:20px;font-weight:600}.dt{font:400 12px "IBM Plex Mono";color:var(--mute)}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:500 12px "IBM Plex Mono";padding:5px 10px;border-radius:999px;background:#1b1b23;border:1px solid var(--line)}
.msg{white-space:pre-wrap;line-height:1.5;color:rgba(236,232,224,.85);background:#0c0c11;border-radius:12px;padding:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel{display:flex;gap:6px;flex-wrap:wrap}
.sel button{font:500 12px "IBM Plex Mono";padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);cursor:pointer}
.sel button.on[data-s=new]{background:var(--sun);color:#140800;border-color:var(--sun)}
.sel button.on[data-s=contacted]{background:var(--blue);color:#04101f;border-color:var(--blue)}
.sel button.on[data-s=done]{background:var(--ok);color:#03140a;border-color:var(--ok)}
.sel button.on[data-s=spam]{background:#444;color:#ddd}
textarea.note{width:100%;min-height:44px;background:#0c0c11;border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px;font:400 14px Geologica;resize:vertical}
.empty,.deny{text-align:center;color:var(--mute);padding:80px 16px;font-size:18px}
.deny b{display:block;font-family:Michroma;color:var(--fg);font-size:22px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1e1e26;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
</style></head><body>
<header><div class="w hd"><div class="logo">NOMAD<small>АДМИН · ЗАХИАЛГА</small></div><div style="display:flex;gap:8px"><button class="btn" id="rf">↻ Шинэчлэх</button><a class="btn" href="/" target="_blank" rel="noopener">Сайт</a></div></div></header>
<main class="w" id="app"><div class="empty">Ачаалж байна…</div></main>
<div class="toast" id="t"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(()=>{const API='https://rdekzdmcajycojxutyqz.supabase.co/functions/v1/nomad-orders',OWNER='sukhbatmongolia0214@gmail.com';
 const sb=supabase.createClient('https://rdekzdmcajycojxutyqz.supabase.co','sb_publishable_PifL06Mih5k4LG4yOPztBQ_7j_yvBzq',{auth:{flowType:'pkce',persistSession:true,detectSessionInUrl:true,storageKey:'nomad-admin-auth'}});
 const app=document.getElementById('app'),rf=document.getElementById('rf'),hd=document.querySelector('.hd > div:last-child');
 try{localStorage.removeItem('nomad_admin_k')}catch(_){}
 const toast=s=>{const t=document.getElementById('t');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)};
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let token='';
 const call=b=>fetch(API,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||r.status),{status:r.status});return j});
 function loginView(msg){rf.style.display='none';const lo=document.getElementById('lo');if(lo)lo.remove();
  app.innerHTML=`<div class="deny"><b>NOMAD АДМИН</b>${msg?`<p style="color:#ff8a8a">${esc(msg)}</p>`:'<p>Зөвхөн эзэмшигчийн Google данс нэвтэрнэ.</p>'}<button class="btn sun" id="gl" style="margin-top:14px;font-size:16px;padding:12px 22px"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#140800" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg> Google-ээр нэвтрэх</button></div>`;
  document.getElementById('gl').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/admin/',queryParams:{login_hint:OWNER,prompt:'select_account'}}})}
 const L={new:'Шинэ',contacted:'Холбогдсон',done:'Гэрээ хийсэн',spam:'Спам'};let all=[],filt='all',q='',notifyOn=true;
 const fmt=d=>{const x=new Date(d);return x.toLocaleDateString('mn-MN',{month:'2-digit',day:'2-digit'})+' '+x.toLocaleTimeString('mn-MN',{hour:'2-digit',minute:'2-digit'})};
 function render(){const c=k=>all.filter(o=>k==='all'||o.status===k).length;
  const rows=all.filter(o=>(filt==='all'?o.status!=='spam':o.status===filt)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));
  app.innerHTML=`${notifyOn?'':'<div class="tag" style="display:block;margin-top:18px;border-color:rgba(255,122,26,.5)">⚠ Имэйл мэдэгдэл хараахан идэвхжээгүй байна.</div>'}<div class="stats">${['all','new','contacted','done','spam'].map(k=>`<div class="st ${filt===k?'on':''}" data-f="${k}"><b>${c(k)}</b><span>${k==='all'?'Бүгд':L[k]}</span></div>`).join('')}</div>
  <div class="tools"><input class="q" id="q" placeholder="Хайх: нэр, утас, бизнес…" value="${esc(q)}"></div>
  <div class="list">${rows.length?rows.map(o=>{const tel=String(o.phone||'').replace(/[^\d+]/g,'');return `<article class="o ${o.status}" data-id="${o.id}">
   <div class="top"><div class="nm">${esc(o.name)}</div><div class="dt">#${o.id} · ${fmt(o.created_at)}</div></div>
   <div class="meta"><span class="tag">📞 ${esc(o.phone)}</span>${o.business?`<span class="tag">🏪 ${esc(o.business)}</span>`:''}${o.site_type?`<span class="tag">🌐 ${esc(o.site_type)}</span>`:''}${o.source?`<span class="tag">↗ ${esc(o.source)}</span>`:''}</div>
   ${o.message?`<div class="msg">${esc(o.message)}</div>`:''}
   <div class="acts"><a class="btn sun" href="tel:${esc(tel)}">Залгах</a><a class="btn" href="viber://chat?number=${encodeURIComponent(tel.length===8?'+976'+tel:tel)}">Viber</a>
    <div class="sel">${Object.keys(L).map(s=>`<button data-s="${s}" class="${o.status===s?'on':''}">${L[s]}</button>`).join('')}</div>
    <button class="btn" data-del style="margin-left:auto">Устгах</button></div>
   <textarea class="note" placeholder="Тэмдэглэл (жишээ: Маргааш 14:00-д дахин залгана)">${esc(o.note||'')}</textarea>
  </article>`}).join(''):'<div class="empty">Захиалга алга байна.</div>'}</div>`;
  app.querySelectorAll('.st').forEach(e=>e.onclick=()=>{filt=e.dataset.f;render()});
  const qi=document.getElementById('q');qi.oninput=()=>{q=qi.value.toLowerCase();const p=qi.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll('.o').forEach(card=>{const id=+card.dataset.id;const o=all.find(x=>x.id===id);
   card.querySelectorAll('.sel button').forEach(b=>b.onclick=async()=>{try{await call({action:'update',id,status:b.dataset.s});o.status=b.dataset.s;render();toast('Хадгаллаа')}catch(e){toast('Алдаа гарлаа')}});
   const n=card.querySelector('.note');n.onchange=async()=>{try{await call({action:'update',id,note:n.value});o.note=n.value;toast('Тэмдэглэл хадгаллаа')}catch(e){toast('Алдаа гарлаа')}};
   card.querySelector('[data-del]').onclick=async()=>{if(!window.confirm('#'+id+' захиалгыг бүр мөсөн устгах уу?'))return;try{await call({action:'delete',id});all=all.filter(x=>x.id!==id);render();toast('Устгалаа')}catch(e){toast('Алдаа гарлаа')}};
  });}
 async function load(){const {data}=await sb.auth.getSession();if(!data.session)return loginView();token=data.session.access_token;
  try{const j=await call({action:'list'});all=j.orders||[];notifyOn=!!j.notify;rf.style.display='';
   if(!document.getElementById('lo')){const b=document.createElement('button');b.className='btn';b.id='lo';b.textContent='Гарах';b.onclick=async()=>{await sb.auth.signOut();loginView()};hd.appendChild(b)}
   render();const n=all.filter(o=>o.status==='new').length;document.title=(n?`(${n}) `:'')+'Nomad · Админ'}
  catch(e){if(e.status===403){await sb.auth.signOut();loginView('Энэ данс админ эрхгүй. Зөвхөн '+OWNER+' нэвтэрнэ.')}else app.innerHTML='<div class="empty">Сервертэй холбогдож чадсангүй. Дахин оролдоно уу.</div>'}}
 rf.onclick=()=>{load();toast('Шинэчиллээ')};
 sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN')load()});
 load();setInterval(()=>{if(!document.hidden&&token)load()},60000);
})();
</script></body></html>
